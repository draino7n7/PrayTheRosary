name: Print PDF Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    name: Build & Release Print PDF
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab Pillow pymupdf

      - name: Run Automated PDF Unit Tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Build Release Print PDF
        run: python scripts/build_print_pdf.py --output PrayTheRosary.pdf

      - name: Build Vervante Print Package
        run: python scripts/build_print_pdf.py -V

      - name: Package Vervante PDFs into Zip Archive
        run: zip -j PrayTheRosary_Vervante.zip assets/print/Vervante/*.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: praytherosary-pdf
          path: PrayTheRosary.pdf

      - name: Upload Vervante Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: praytherosary-vervante-zip
          path: PrayTheRosary_Vervante.zip

      - name: Attach PDFs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PrayTheRosary.pdf
            PrayTheRosary_Vervante.zip
